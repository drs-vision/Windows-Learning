<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CoinQuest">
<meta name="referrer" content="no-referrer">
<title>CoinQuest Parent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f1ea; --panel: #ffffff; --panel-2: #f8f6f1; --ink: #1d2433; --muted: #6b7280; --line: #e6e1d6;
    --gold: #e0a100; --gold-ink: #6b4a00; --gold-soft: #fff4d1; --good: #1f8a4c; --good-soft: #e3f5ea; --bad: #c2410c; --bad-soft: #fdeadf;
    --accent: #2f5bd3; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1320; --panel: #171e2e; --panel-2: #1d2538; --ink: #eef1f7; --muted: #98a2b3; --line: #2a3349;
      --gold: #f2b92d; --gold-ink: #ffd772; --gold-soft: #3a2f12; --good: #4ade80; --good-soft: #12301f; --bad: #fb923c; --bad-soft: #3a1f12;
      --accent: #7aa2ff; --shadow: none; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 0 14px; }
  header img { width: 34px; height: 34px; border-radius: 9px; }
  header h1 { font-size: 19px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin: -6px 0 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--good); } .dot.off { background: var(--bad); } .dot.wait { background: var(--gold); animation: pulse 1s infinite alternate; }
  @keyframes pulse { to { opacity: .35; } }
  button { font: inherit; border: 0; border-radius: 12px; padding: 10px 14px; cursor: pointer; background: var(--panel-2); color: var(--ink); min-height: 44px; }
  button:active { transform: scale(.98); }
  button.primary { background: var(--accent); color: #fff; font-weight: 600; }
  button.give { background: var(--good-soft); color: var(--good); font-weight: 600; }
  button.take { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
  button.icon { min-width: 44px; padding: 8px; background: transparent; font-size: 20px; }
  button:disabled { opacity: .5; }
  .card { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); }
  .kid-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .kid-name { font-size: 20px; font-weight: 700; margin: 0; }
  .here { font-size: 12px; color: var(--good); background: var(--good-soft); border-radius: 99px; padding: 2px 8px; margin-left: 6px; vertical-align: middle; font-weight: 600; }
  .balance { font-size: 34px; font-weight: 800; color: var(--gold-ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .coin { display: inline-block; width: .8em; height: .8em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, var(--gold) 60%, #b37d00); vertical-align: -.05em; margin-right: .15em; box-shadow: inset 0 0 0 .07em rgba(0,0,0,.15); }
  .today { color: var(--muted); font-size: 14px; margin: 2px 0 12px; }
  .row { display: flex; gap: 10px; }
  .row > button { flex: 1; }
  .unlock { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--gold-soft); border-radius: 12px; padding: 8px 8px 8px 12px; margin-top: 10px; font-size: 14px; }
  details { margin-top: 10px; }
  summary { color: var(--muted); font-size: 14px; cursor: pointer; padding: 6px 0; }
  ul.feed { list-style: none; margin: 4px 0 0; padding: 0; font-size: 14px; }
  ul.feed li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid var(--line); }
  ul.feed .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plus { color: var(--good); font-weight: 700; font-variant-numeric: tabular-nums; } .minus { color: var(--bad); font-weight: 700; font-variant-numeric: tabular-nums; }
  .t { color: var(--muted); font-size: 12px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 4px 10px; }
  .claim .who { font-weight: 700; } .claim p { margin: 4px 0 12px; }
  .empty { text-align: center; padding: 28px 18px; }
  .empty h2 { text-transform: none; letter-spacing: 0; font-size: 22px; color: var(--ink); margin: 12px 0 8px; }
  .empty ol { text-align: left; color: var(--muted); padding-left: 22px; }
  .note { color: var(--muted); font-size: 13px; text-align: center; margin-top: 18px; }
  .err { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  dialog { border: 0; border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); width: 100%; max-width: 560px; margin: auto auto 0; background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(10,14,24,.45); }
  dialog h3 { margin: 0 0 12px; font-size: 19px; }
  dialog .field { margin-bottom: 10px; } dialog .grid2 { margin-top: 0; }
  .amounts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .amounts button.sel { outline: 2px solid var(--accent); }
  input[type=number], input[type=text], input[type=search] { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); margin-bottom: 10px; min-height: 44px; }
  .hint { background: var(--gold-soft); color: var(--gold-ink); border-radius: 14px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; display: flex; gap: 10px; align-items: flex-start; }
  .hint button { min-height: 0; padding: 2px 8px; background: transparent; color: inherit; font-size: 18px; }
  main { padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  .pills { display: flex; gap: 8px; overflow-x: auto; margin: -4px 0 12px; scrollbar-width: none; }
  .pills button { white-space: nowrap; min-height: 36px; padding: 6px 14px; font-size: 14px; border-radius: 99px; }
  .pills button.on { background: var(--accent); color: #fff; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar button { background: transparent; border-radius: 10px; min-height: 52px; padding: 4px 2px; font-size: 11px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
  .tabbar button span { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .7; }
  .tabbar button.on { color: var(--accent); font-weight: 700; } .tabbar button.on span { filter: none; opacity: 1; }
  .tabbar i { position: absolute; top: 2px; left: calc(50% + 6px); background: var(--bad); color: #fff; font-style: normal; font-size: 11px; font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
  @media (min-width: 600px) { .tabbar { left: 50%; transform: translateX(-50%); max-width: 560px; border-radius: 18px 18px 0 0; border: 1px solid var(--line); border-bottom: 0; } }
  .lead { color: var(--muted); font-size: 14px; margin: 0 4px 12px; }
  .card.list { padding: 4px 16px; } ul.feed li:first-child { border-top: 0; }
  .quest-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .quest.off { opacity: .7; } .quest .row.between { align-items: center; margin: 4px 0; }
  .row.between { justify-content: space-between; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0 4px; }
  .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .field span { display: flex; justify-content: space-between; gap: 6px; } .field small { opacity: .8; }
  .field input, .field select { margin: 0; }
  select { font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); min-height: 44px; }
  .switch { position: relative; display: inline-block; width: 52px; height: 32px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked + span { background: var(--good); } .switch input:checked + span::after { transform: translateX(20px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  ul.applist { list-style: none; margin: 8px 0 10px; padding: 0; max-height: 38vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 12px; }
  ul.applist li { border-top: 1px solid var(--line); padding: 0 12px; } ul.applist li:first-child { border-top: 0; }
  ul.applist li.t { padding: 12px; }
  label.pick { display: flex; align-items: center; gap: 12px; padding: 9px 0; font-size: 15px; cursor: pointer; }
  label.pick input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent, #4f7cff); }
  label.pick b { font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
  .chip { display: inline-flex; align-items: center; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 2px 2px 12px; font-size: 14px; }
  .chip button { min-height: 32px; min-width: 32px; padding: 0; background: transparent; color: var(--muted); font-size: 18px; border-radius: 99px; }
  form.row input { margin: 0; flex: 1; min-width: 0; } form.row button { flex: none; }
  ul.prizes { list-style: none; margin: 0; padding: 0; }
  ul.prizes li + li { border-top: 1px solid var(--line); }
  ul.prizes button { width: 100%; display: flex; align-items: center; gap: 12px; background: transparent; padding: 12px 0; text-align: left; border-radius: 0; }
  ul.prizes button.off { opacity: .55; } .pi { font-size: 22px; width: 28px; text-align: center; } .price { margin-left: auto; font-weight: 700; color: var(--gold-ink); white-space: nowrap; }
  button.wide { width: 100%; margin-top: 4px; } button.small { min-height: 0; padding: 6px 10px; font-size: 13px; }
  button.link { background: transparent; color: var(--accent); padding: 8px 0 0; min-height: 0; font-size: 14px; }
  .note button.small { margin-top: 8px; }
  #toast { display: none; position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; z-index: 9; max-width: 90vw; }
</style>
</head>
<body>
<main id="app"><p class="note">Loading…</p></main>
<dialog id="sheet"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
