name: Build & Release

# Every push to main becomes a GitHub Release (v0.1.<run>) that installed machines pick up automatically.
# Pull requests just build and test.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION"

      # ---------- web ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Web — install, test, build
        working-directory: src/web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Fetch arcade games (best effort)
        continue-on-error: true
        run: node scripts/fetch-games.mjs

      - name: Fetch full Bible text (best effort)
        continue-on-error: true
        run: node scripts/fetch-content.mjs

      # ---------- .NET ----------
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: .NET — restore, build, test
        run: |
          dotnet restore CoinQuest.sln
          dotnet build CoinQuest.sln -c Release --no-restore -p:Version=${{ steps.ver.outputs.version }}
          dotnet test tests/Shared.Tests/CoinQuest.Shared.Tests.csproj -c Release --no-build

      - name: .NET — publish
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          foreach ($p in @("src/Guardian/CoinQuest.Guardian.csproj", "src/Updater/CoinQuest.Updater.csproj", "src/Scholar/CoinQuest.Scholar.csproj", "src/ParentConsole/CoinQuest.ParentConsole.csproj")) {
            dotnet publish $p -c Release -r win-x64 --self-contained false -o publish -p:Version=$v -p:PublishReadyToRun=false
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          New-Item -ItemType Directory -Force publish/web, publish/content, redist | Out-Null
          Copy-Item -Recurse -Force src/web/dist/* publish/web/
          Copy-Item -Recurse -Force content/* publish/content/
          Remove-Item -Force publish/content/games/html5/.gitkeep, publish/content/games/swf/.gitkeep -ErrorAction SilentlyContinue
          # Prerequisites bundled into the installer (not into the update zip): .NET 8 Desktop Runtime + WebView2 bootstrapper.
          Invoke-WebRequest -Uri "https://aka.ms/dotnet/8.0/windowsdesktop-runtime-win-x64.exe" -OutFile redist/windowsdesktop-runtime-win-x64.exe
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile redist/MicrosoftEdgeWebview2Setup.exe
          Get-ChildItem redist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-ChildItem publish -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "publish size: {0:N1} MB" -f ($_.Sum / 1MB) }

      # ---------- package ----------
      - name: Zip (for auto-update)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath dist/CoinQuest-win-x64.zip -CompressionLevel Optimal
          $h = (Get-FileHash dist/CoinQuest-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  CoinQuest-win-x64.zip" | Set-Content -NoNewline dist/CoinQuest-win-x64.zip.sha256
          "sha256 $h"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DVersion=${{ steps.ver.outputs.version }} /DStage=..\publish /DRedist=..\redist installer\CoinQuest.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: coinquest-${{ steps.ver.outputs.version }}
          path: dist/*
          retention-days: 14

      # ---------- release (main only) ----------
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.ver.outputs.version }}"
          gh release delete "$V" -y --cleanup-tag 2>/dev/null || true   # re-runs of the same workflow run
          NOTES="Automated build of ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)"
          gh release create "$V" dist/CoinQuest-win-x64.zip dist/CoinQuest-win-x64.zip.sha256 dist/CoinQuest-Setup-*.exe \
            --title "CoinQuest $V" --notes "$NOTES" --latest

  # ---------- end-to-end test of the real installed app, with screenshots ----------
  # Installs the release on a clean Windows machine, sets it up through the Parent Console, then plays it as a
  # separate standard "kid" account (internet-locked like a real child): arcade, sampler, YouTube, Letter Rescue,
  # Scripture typing. Screenshots and logs are uploaded as the "e2e-screens" artifact.
  e2e:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coinquest-${{ needs.build.outputs.version }}
          path: dist
      - name: Create the kid account and install CoinQuest
        shell: pwsh
        run: |
          net user kid 'Kid-Pass-2026!' /add /y
          $setup = Get-ChildItem dist/CoinQuest-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -PassThru
          $p.WaitForExit(600000) | Out-Null
          Get-Content install.log -Tail 15
          New-Item -ItemType File -Force 'C:\ProgramData\CoinQuest\e2e-test-mode' | Out-Null
          Restart-Service CoinQuestGuardian
          Start-Sleep 5
          Get-Service CoinQuestGuardian
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Play it
        shell: pwsh
        working-directory: tests/e2e
        run: |
          npm init -y | Out-Null
          npm i playwright-core@1.48.2 --no-audit --no-fund | Out-Null
          node run.mjs
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-shots
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-shots/logs | Out-Null
          Copy-Item C:\ProgramData\CoinQuest\logs\* e2e-shots/logs/ -ErrorAction SilentlyContinue
          Copy-Item C:\Users\kid\AppData\Local\CoinQuest\shell.log e2e-shots/logs/kid-shell.log -ErrorAction SilentlyContinue
          Copy-Item $env:LOCALAPPDATA\CoinQuest\shell.log e2e-shots/logs/parent-shell.log -ErrorAction SilentlyContinue
      - name: Publish screenshots to the e2e-results branch
        if: always()
        shell: bash
        run: |
          RUN="${{ needs.build.outputs.version }}"
          git config user.name "coinquest-ci"; git config user.email "ci@users.noreply.github.com"
          git fetch origin e2e-results:e2e-results 2>/dev/null || true
          mkdir -p /tmp/e2e && cp -r e2e-shots/. /tmp/e2e/
          if git rev-parse --verify e2e-results >/dev/null 2>&1; then git checkout -f e2e-results; else git checkout --orphan e2e-results; git rm -rf -q . ; fi
          git clean -fdxq   # never commit the build or anything else lying around
          rm -rf "runs/$RUN" latest && mkdir -p "runs/$RUN" && cp -r /tmp/e2e/. "runs/$RUN/" && cp -r /tmp/e2e latest
          git add -A && git commit -qm "e2e $RUN" && git push -q origin e2e-results
          # Summary as annotations, readable without downloading anything
          while IFS= read -r line; do echo "::notice title=e2e::$line"; done < <(grep -E "PASS|FAIL|ALL|games:|finish:|error" /tmp/e2e/log.txt | head -40)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screens
          path: e2e-shots
          retention-days: 14
