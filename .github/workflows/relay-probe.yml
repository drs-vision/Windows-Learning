# Checks the public ntfy relay from a GitHub runner; results show as annotations.
name: relay probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/relay-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice title=health::$(curl -s -m 15 -w ' HTTP %{http_code} in %{time_total}s' https://ntfy.sh/v1/health)"
          echo "::notice title=home::$(curl -s -m 15 -o /dev/null -w 'HTTP %{http_code} in %{time_total}s' https://ntfy.sh/)"
          echo "::notice title=docs::$(curl -s -m 15 -o /dev/null -w 'HTTP %{http_code}' https://docs.ntfy.sh/config/) "
