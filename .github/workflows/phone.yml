# Publishes the parent phone app (src/phone) to GitHub Pages: https://drs-vision.github.io/Windows-Learning/
# (Settings → Pages → Source: GitHub Actions.) The page is static; everything a family sends is scrambled in the
# browser with the key from their QR code, and the key itself stays after '#' (never sent to this server).
#
# When the repository has the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, this also deploys CoinQuest's
# own relay (relay/, Cloudflare Workers + Durable Objects, free tier) and lists it in relay.json beside the phone app.
# PCs and phones read relay.json and move to it on their own; ntfy.sh stays as the fallback. No secrets: ntfy.sh only.
name: phone app
on:
  push:
    branches: [main]
    paths: ['src/phone/**', 'relay/**', '.github/workflows/phone.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy CoinQuest's relay to Cloudflare (when connected)
        id: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::notice title=relay::Cloudflare isn't connected yet (secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID) — phones use ntfy.sh."
            echo "url=" >> "$GITHUB_OUTPUT"; exit 0
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          # A new Cloudflare account has no workers.dev address yet: make one.
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            sub="coinquest-$(head -c 4 /dev/urandom | od -An -tx1 | tr -d ' \n')"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$sub\"}" "$api" | jq -c '{success, errors}'
          fi
          cd relay
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || url="https://coinquest-relay.$sub.workers.dev"
          for i in 1 2 3 4 5 6; do
            if curl -sf "$url/v1/health" >/dev/null; then echo "::notice title=relay::CoinQuest relay is live at $url"; break; fi
            sleep 10
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Build the site (phone app + relay.json)
        run: |
          mkdir -p site && cp -r src/phone/. site/
          if [ -n "${{ steps.relay.outputs.url }}" ]; then
            printf '{ "relays": [ { "url": "%s", "kind": "cq" }, { "url": "https://ntfy.sh", "kind": "ntfy" } ] }\n' "${{ steps.relay.outputs.url }}" > site/relay.json
          fi
          cat site/relay.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
