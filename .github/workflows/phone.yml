# Publishes the parent phone app (src/phone) to GitHub Pages: https://drs-vision.github.io/Windows-Learning/
# (Settings → Pages → Source: GitHub Actions.) The page is static; everything a family sends is scrambled in the
# browser with the key from their QR code, and the key itself stays after '#' (never sent to this server).
name: phone app
on:
  push:
    branches: [main]
    paths: ['src/phone/**', '.github/workflows/phone.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/phone
      - id: deploy
        uses: actions/deploy-pages@v4
